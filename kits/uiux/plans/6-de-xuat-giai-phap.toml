# Đề xuất giải pháp UI/UX: ba hướng KHÁC NHAU chạy song song, rồi so sánh.
#
# Đây là chỗ graph nhiều agent hơn hẳn một agent: ba hướng được nghĩ độc lập
# nên không hướng nào bị neo vào hướng đầu tiên. Mỗi hướng nằm trên một branch
# riêng, bạn lấy nguyên hướng mình chọn hoặc ghép từng phần.
goal = "Đề xuất giải pháp: <BÀI TOÁN>"

[[node]]
id = "huong-an-toan"
title = "Hướng ít rủi ro"
agent = "claude"
model = "sonnet"
task = """
Bài toán: <BÀI TOÁN>. Bối cảnh và ràng buộc ở dau-vao/.

Hướng của bạn: CẢI TIẾN DẦN — giữ nguyên kiến trúc hiện tại, sửa những chỗ
gây đau nhất, làm được trong 1-2 sprint.

Mô tả giải pháp bằng lời đủ chi tiết để dev và designer hình dung được: từng
màn hình, từng bước trong luồng, trạng thái rỗng/đang tải/lỗi, chuyện gì xảy ra
khi người dùng làm sai. Có thể vẽ wireframe bằng ASCII.

Ghi vào ket-qua/giai-phap-an-toan.md:
## Tóm tắt hướng ## Luồng người dùng ## Mô tả màn hình ## Ưu và nhược
## Chi phí ước lượng ## Cách đo hiệu quả
"""
verify = "python3 uiux/kiem_tai_lieu.py ket-qua/giai-phap-an-toan.md --muc 'Luồng người dùng' --muc 'Ưu và nhược' --muc 'Cách đo' --tu-toi-thieu 500"

[[node]]
id = "huong-thiet-ke-lai"
title = "Hướng thiết kế lại"
agent = "claude"
model = "opus"
task = """
Bài toán: <BÀI TOÁN>. Bối cảnh và ràng buộc ở dau-vao/.

Hướng của bạn: THIẾT KẾ LẠI — được phép thay đổi kiến trúc và luồng, miễn là
giải đúng gốc vấn đề. Nhưng phải nói rõ cái giá phải trả: người dùng cũ học
lại gì, dev làm lại gì, dữ liệu chuyển đổi thế nào.

Mô tả chi tiết như hướng kia (luồng, màn hình, trạng thái, lỗi), kèm lý do vì
sao cấu trúc mới đúng hơn cấu trúc cũ.

Ghi vào ket-qua/giai-phap-thiet-ke-lai.md:
