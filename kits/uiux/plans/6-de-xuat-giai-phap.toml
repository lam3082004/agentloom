## Cái giá phải trả ## Chi phí ước lượng ## Cách đo hiệu quả
"""
verify = "python3 uiux/kiem_tai_lieu.py ket-qua/giai-phap-thiet-ke-lai.md --muc 'Vì sao phải đổi' --muc 'Luồng người dùng' --muc 'giá phải trả' --muc 'Cách đo' --tu-toi-thieu 600"

[[node]]
id = "huong-khac-biet"
title = "Hướng phá cách"
agent = "claude"
model = "opus"
task = """
Bài toán: <BÀI TOÁN>. Bối cảnh ở dau-vao/.

Hướng của bạn: ĐẶT LẠI CÂU HỎI. Trước khi thiết kế, hỏi xem bài toán có đang
bị phát biểu sai không — liệu có cách nào khiến bước này BIẾN MẤT thay vì làm
