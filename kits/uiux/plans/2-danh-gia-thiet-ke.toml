[[node]]
id = "kha-dung"
title = "Khả dụng (heuristic)"
agent = "claude"
model = "opus"
task = """
Đánh giá khả dụng của: <TÊN MÀN HÌNH / LUỒNG>. Tư liệu ở dau-vao/ — đọc hết
